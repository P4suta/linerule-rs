avoid-breaking-exported-api = false
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 7
type-complexity-threshold = 250
too-many-lines-threshold = 100
trivial-copy-size-limit = 128
pass-by-value-size-limit = 256

# Tests legitimately use `unwrap`/`expect`/`panic`/`println`/`dbg` — gate them
# only outside the test boundary.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# B.5: fold the old xtask strict-code role into clippy config + cargo-deny
disallowed-macros = [
    { path = "lazy_static::lazy_static", reason = "use std::sync::OnceLock or std::sync::LazyLock" },
]
disallowed-types = [
    { path = "once_cell::sync::Lazy", reason = "use std::sync::LazyLock (stable since 1.80)" },
    { path = "once_cell::sync::OnceCell", reason = "use std::sync::OnceLock (stable since 1.70)" },
]
disallowed-methods = [
    { path = "std::env::set_var", reason = "do not mutate env vars outside the boundary" },
    { path = "windows::Win32::Graphics::Direct2D::ID2D1RenderTarget::BeginDraw", reason = "context from a composition drawing surface is returned already in drawing mode (MS Docs). Nesting D2D BeginDraw yields D2DERR_WRONG_STATE -> surface-stuck cascade failure (Phase I sequel). Issue SetTransform/Clear/DrawText directly and close via win32_ffi::composition::end_surface_draw. `ID2D1DeviceContext` inherits this method via Deref<Target=ID2D1RenderTarget>, so deny on the parent trait path." },
    { path = "windows::Win32::Graphics::Direct2D::ID2D1RenderTarget::EndDraw", reason = "as above. The composition surface's EndDraw also closes the D2D session internally." },
    { path = "windows::Win32::UI::WindowsAndMessaging::ShowWindow", reason = "call via the win32_ffi::show_window_noactivate() wrapper. Direct calls are a focus-stealing hazard (guard added after Phase I PR #60 intentionally skipped it -> window never became visible in the real environment)." },
]
