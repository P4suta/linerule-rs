name: linerule-rs

services:
  dev:
    # Prebuilt image from CI; `compose build` for local Dockerfile iteration.
    image: ghcr.io/p4suta/linerule-rs-dev:latest
    build:
      context: .
      args:
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
      secrets:
        - github-token
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      INSIDE_CONTAINER: "1"
      CARGO_TARGET_DIR: /workspace/target
      LINERULE_LOG: "${LINERULE_LOG:-debug,wnd_proc=info,heartbeat=info,cursor_tracker=info}"
      # Force cargo-xwin clang backend (single-tarball sysroot, baked into
      # image) to avoid the old clang-cl backend's slow split MSVC CRT download.
      XWIN_CROSS_COMPILER: clang
    volumes:
      - .:/workspace:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      # No xwin-cache volume: the ~500 MB sysroot is baked into the image; a
      # volume would shadow it with an empty dir and re-trigger the download.
      # No node_modules volume: it lives on the bind mount owned by the host
      # user; a named volume is created root-owned and needs chown.
    init: true
    stdin_open: true
    tty: true

volumes:
  cargo-registry:
  cargo-git:

# GITHUB_TOKEN as build secret (not baked in) so cargo-binstall authenticates
# and skips the unauthenticated rate limit. Empty/missing token is tolerated.
secrets:
  github-token:
    environment: GITHUB_TOKEN
