name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build"
        required: true
      publish:
        description: "Publish the immutable release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_LOCKED: "true"

jobs:
  release-gate:
    name: verify required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          install_args: aqua:cli/cli
          cache: true
      - name: require active repository rulesets
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |-
          ruleset_id() {
            local name="$1"
            mise exec aqua:cli/cli -- gh api \
              "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" \
              --jq "map(select(.name == \"${name}\" and .enforcement == \"active\")) | if length == 1 then .[0].id else empty end"
          }
          require_rule() {
            local id="$1"
            local rule="$2"
            local count
            count="$(
              mise exec aqua:cli/cli -- gh api \
                "repos/${GITHUB_REPOSITORY}/rulesets/${id}" \
                --jq "[.rules[] | select(.type == \"${rule}\")] | length"
            )"
            if [ "$count" != "1" ]; then
              echo "::error::active ruleset ${id} does not enforce ${rule}"
              exit 1
            fi
          }

          default_id="$(ruleset_id protect-default-branch)"
          release_id="$(ruleset_id protect-release-tags)"
          signed_id="$(ruleset_id require-signed-commits)"
          for pair in \
            "protect-default-branch:${default_id}" \
            "protect-release-tags:${release_id}" \
            "require-signed-commits:${signed_id}"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::required active ruleset is missing: ${pair%%:*}"
              exit 1
            fi
          done
          for rule in deletion non_fast_forward required_linear_history \
            pull_request required_status_checks; do
            require_rule "$default_id" "$rule"
          done
          for rule in deletion non_fast_forward update; do
            require_rule "$release_id" "$rule"
          done
          require_rule "$signed_id" required_signatures
          context_count="$(
            mise exec aqua:cli/cli -- gh api \
              "repos/${GITHUB_REPOSITORY}/rulesets/${default_id}" \
              --jq '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.context == "ci-required")] | length'
          )"
          if [ "$context_count" != "1" ]; then
            echo "::error::protect-default-branch does not require ci-required"
            exit 1
          fi
      - name: require successful hosted CI for publishing
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |-
          commit="$(git rev-parse HEAD)"
          for required in ci-required; do
            conclusion=""
            for attempt in $(seq 1 30); do
              conclusion="$(
                mise exec aqua:cli/cli -- gh api \
                  "repos/${GITHUB_REPOSITORY}/commits/${commit}/check-runs?per_page=100" \
                  --jq ".check_runs | map(select(.name == \"${required}\")) | sort_by(.completed_at) | last | .conclusion // \"\""
              )"
              if [ "$conclusion" = "success" ]; then
                break
              fi
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|stale)
                  echo "::error::${required} for ${commit} concluded ${conclusion}"
                  exit 1
                  ;;
              esac
              if [ "$attempt" -eq 30 ]; then
                break
              fi
              echo "${required} for ${commit} is pending (attempt ${attempt}/30)"
              sleep 15
            done
            if [ "$conclusion" != "success" ]; then
              echo "::error::${required} for ${commit} is '${conclusion:-missing}', not success"
              exit 1
            fi
          done

  build:
    name: native build (${{ matrix.arch }})
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: x64
            runtime: win-x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: ARM64
            runtime: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          install_args: rust dotnet
          cache: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: stamp stable version
        shell: pwsh
        run: |
          $version = mise exec rust --command "cargo xtask version --channel stable"
          if ($LASTEXITCODE -ne 0) { throw "version stamp failed" }
          "LINERULE_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: build Rust executable
        run: >-
          mise exec rust --command
          'cargo build --locked --release -p linerule-app
          --target ${{ matrix.target }}'
      - name: publish self-contained Fluent settings executable
        shell: pwsh
        run: |
          $project = "ui/linerule-settings/Linerule.Settings.csproj"
          mise exec dotnet --command "dotnet restore $project --locked-mode -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.runtime }}"
          if ($LASTEXITCODE -ne 0) { throw "WinUI restore failed" }
          mise exec dotnet --command "dotnet publish $project --no-restore -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} --self-contained true -p:Version=$env:LINERULE_VERSION -p:PublishDir=$PWD/settings-publish/"
          if ($LASTEXITCODE -ne 0) { throw "WinUI publish failed" }
          if (-not (Test-Path settings-publish/linerule-settings.exe -PathType Leaf)) {
            throw "WinUI single-file executable was not published"
          }
      - name: stage architecture payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifact/settings | Out-Null
          Copy-Item target/${{ matrix.target }}/release/linerule.exe release-artifact/
          Copy-Item settings-publish/linerule-settings.exe release-artifact/settings/
      - name: smoke CLI
        shell: pwsh
        run: |
          $exe = "release-artifact/linerule.exe"
          foreach ($command in @("version", "diagnostics")) {
            $process = Start-Process -FilePath $exe `
              -ArgumentList $command -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "$command smoke failed with exit code $($process.ExitCode)"
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.arch }}
          path: release-artifact
          if-no-files-found: error

  package:
    name: sign, package, verify, attest, publish
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      HAVE_SIGNING: ${{ secrets.ES_USERNAME != '' && secrets.CREDENTIAL_ID != '' && secrets.MSIX_PUBLISHER != '' }}
      PACKAGE_PUBLISHER: ${{ secrets.MSIX_PUBLISHER || 'CN=linerule Development' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          install_args: rust dotnet cyclonedx python cargo:cargo-sbom pipx:reuse aqua:cli/cli
          cache: true
      - name: Install exact CycloneDX .NET tool
        run: mise install dotnet:CycloneDX
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*
          path: binaries
      - name: resolve version and stage PEs
        shell: pwsh
        run: |
          $metadata = mise exec rust --command (
            "cargo metadata --locked --no-deps --format-version 1"
          ) | ConvertFrom-Json
          $versions = @($metadata.packages |
            Where-Object { $_.name -in @("linerule-app", "linerule-core",
              "linerule-platform-windows", "xtask") } |
            Select-Object -ExpandProperty version -Unique)
          if ($versions.Count -ne 1) { throw "workspace versions differ" }
          "RELEASE_VERSION=$($versions[0])" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path sign-pe | Out-Null
          Copy-Item binaries/release-binary-x64/linerule.exe sign-pe/linerule-x64.exe
          Copy-Item binaries/release-binary-arm64/linerule.exe sign-pe/linerule-arm64.exe
          Copy-Item binaries/release-binary-x64/settings/linerule-settings.exe sign-pe/linerule-settings-x64.exe
          Copy-Item binaries/release-binary-arm64/settings/linerule-settings.exe sign-pe/linerule-settings-arm64.exe
      - name: require signing inputs before publish
        if: env.PUBLISH == 'true' && env.HAVE_SIGNING != 'true'
        shell: pwsh
        run: throw "Publishing requires eSigner credentials and MSIX_PUBLISHER"
      - name: sign PEs
        if: env.HAVE_SIGNING == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\sign-pe
          output_path: ${{ github.workspace }}\signed-pe
          environment_name: PROD
          malware_block: "true"
      - name: select and verify final PEs
        shell: pwsh
        run: |
          if ($env:HAVE_SIGNING -eq "true") {
            Copy-Item signed-pe/linerule-x64.exe sign-pe/linerule-x64.exe -Force
            Copy-Item signed-pe/linerule-arm64.exe sign-pe/linerule-arm64.exe -Force
            Copy-Item signed-pe/linerule-settings-x64.exe sign-pe/linerule-settings-x64.exe -Force
            Copy-Item signed-pe/linerule-settings-arm64.exe sign-pe/linerule-settings-arm64.exe -Force
            foreach ($file in Get-ChildItem sign-pe/*.exe) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne "Valid") {
                throw "Invalid signature on $($file.Name): $($signature.Status)"
              }
            }
          } else {
            Write-Warning "Unsigned package smoke run; nothing may be published"
          }
          Copy-Item sign-pe/linerule-settings-x64.exe binaries/release-binary-x64/settings/linerule-settings.exe -Force
          Copy-Item sign-pe/linerule-settings-arm64.exe binaries/release-binary-arm64/settings/linerule-settings.exe -Force
      - name: restore pinned Windows SDK packaging tools
        shell: pwsh
        run: |
          mise exec dotnet --command "dotnet restore ui/linerule-settings/Linerule.Settings.csproj --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64"
          if ($LASTEXITCODE -ne 0) { throw "WinUI locked restore failed" }
      - name: build portable ZIPs and MSIX bundle
        shell: pwsh
        run: |
          ./packaging/package.ps1 `
            -Version $env:RELEASE_VERSION `
            -Publisher $env:PACKAGE_PUBLISHER `
            -X64Exe sign-pe/linerule-x64.exe `
            -Arm64Exe sign-pe/linerule-arm64.exe `
            -X64SettingsExe binaries/release-binary-x64/settings/linerule-settings.exe `
            -Arm64SettingsExe binaries/release-binary-arm64/settings/linerule-settings.exe `
            -OutputDirectory dist
      - name: build lower-version MSIX update fixture
        shell: pwsh
        run: |
          ./packaging/package.ps1 `
            -Version 0.0.1 `
            -Publisher $env:PACKAGE_PUBLISHER `
            -X64Exe sign-pe/linerule-x64.exe `
            -Arm64Exe sign-pe/linerule-arm64.exe `
            -X64SettingsExe binaries/release-binary-x64/settings/linerule-settings.exe `
            -Arm64SettingsExe binaries/release-binary-arm64/settings/linerule-settings.exe `
            -OutputDirectory install-test-old
      - name: stage MSIX bundle for signing
        if: env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path sign-bundle | Out-Null
          Copy-Item dist/linerule.msixbundle sign-bundle/
          Copy-Item install-test-old/linerule.msixbundle `
            sign-bundle/linerule-old.msixbundle
      - name: sign MSIX bundle
        if: env.HAVE_SIGNING == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\sign-bundle
          output_path: ${{ github.workspace }}\signed-bundle
          environment_name: PROD
          malware_block: "true"
      - name: select and verify final bundle
        shell: pwsh
        run: |
          if ($env:HAVE_SIGNING -eq "true") {
            Copy-Item signed-bundle/linerule.msixbundle `
              dist/linerule.msixbundle -Force
            Copy-Item signed-bundle/linerule-old.msixbundle `
              install-test-old/linerule.msixbundle -Force
            foreach ($bundle in @(
              "dist/linerule.msixbundle",
              "install-test-old/linerule.msixbundle"
            )) {
              $signature = Get-AuthenticodeSignature $bundle
              if ($signature.Status -ne "Valid") {
                throw "Invalid MSIX bundle signature on $bundle`: $($signature.Status)"
              }
            }
          }
      - name: generate SBOM and source SPDX
        shell: pwsh
        run: |
          mise exec rust cargo:cargo-sbom dotnet dotnet:CycloneDX cyclonedx `
            --command (
              "powershell.exe -NoProfile -ExecutionPolicy Bypass " +
              "-File tools/New-Sbom.ps1 " +
              "-OutputFile dist/linerule-sbom.cdx.json"
            )
          if ($LASTEXITCODE -ne 0) { throw "merged SBOM generation failed" }
          mise exec pipx:reuse --command "reuse lint"
          if ($LASTEXITCODE -ne 0) { throw "reuse lint failed" }
          mise exec pipx:reuse --command "reuse spdx --output dist/linerule-source.spdx"
      - name: generate checksums
        shell: pwsh
        run: |
          $files = @(
            "linerule.msixbundle",
            "linerule.appinstaller",
            "linerule-portable-x64.zip",
            "linerule-portable-arm64.zip",
            "linerule-sbom.cdx.json",
            "linerule-source.spdx"
          )
          $lines = foreach ($name in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLower()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllText(
            "$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n",
            [System.Text.UTF8Encoding]::new($false))
      - name: fail-closed release validation
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $arguments = "cargo xtask release-check --artifacts dist"
          if ($env:PUBLISH -eq "true") {
            $arguments += " --expected-tag $tag"
          }
          if ($env:HAVE_SIGNING -ne "true") {
            $arguments += " --allow-unsigned"
          }
          mise exec rust --command $arguments
          if ($LASTEXITCODE -ne 0) {
            throw "release-check failed with exit code $LASTEXITCODE"
          }
      - name: installed update, repair, uninstall, and Portable isolation
        if: env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          ./packaging/Test-Packages.ps1 `
            -PreviousBundlePath install-test-old/linerule.msixbundle `
            -PreviousAppInstallerPath install-test-old/linerule.appinstaller `
            -BundlePath dist/linerule.msixbundle `
            -AppInstallerPath dist/linerule.appinstaller `
            -PortableZip dist/linerule-portable-x64.zip `
            -RequireSignature
      - name: stage native package evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path target/release-evidence/dist | Out-Null
          New-Item -ItemType Directory -Force `
            -Path target/release-evidence/install-test-old | Out-Null
          if (Test-Path -LiteralPath dist -PathType Container) {
            Copy-Item dist/* target/release-evidence/dist/
          }
          if (Test-Path -LiteralPath (
            "install-test-old/linerule.msixbundle"
          ) -PathType Leaf) {
            Copy-Item install-test-old/linerule.msixbundle `
              target/release-evidence/install-test-old/
          }
          if (Test-Path -LiteralPath (
            "install-test-old/linerule.appinstaller"
          ) -PathType Leaf) {
            Copy-Item install-test-old/linerule.appinstaller `
              target/release-evidence/install-test-old/
          }
      - name: upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-assets
          path: target/release-evidence
          if-no-files-found: error
      - name: create or reuse draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $draft = & mise exec "aqua:cli/cli" -- gh release view $tag `
            --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -ne 0) {
            & mise exec "aqua:cli/cli" -- gh release create $tag `
              --draft --title $tag --generate-notes
          } elseif ($draft -ne "true") {
            throw "Release $tag is already published and immutable"
          }
      - name: upload complete draft
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          & mise exec "aqua:cli/cli" -- gh release upload $tag dist/* --clobber
      - name: attest release assets
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/linerule.msixbundle
            dist/linerule.appinstaller
            dist/linerule-portable-x64.zip
            dist/linerule-portable-arm64.zip
            dist/linerule-sbom.cdx.json
            dist/linerule-source.spdx
            dist/SHA256SUMS.txt
      - name: attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/linerule.msixbundle
          sbom-path: dist/linerule-sbom.cdx.json

  arm64-package-lifecycle:
    name: signed package lifecycle (Windows 11 ARM64)
    needs: package
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: windows-11-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          path: release-evidence
      - name: install, update, repair, uninstall, and verify Portable isolation
        shell: pwsh
        run: |
          ./packaging/Test-Packages.ps1 `
            -PreviousBundlePath release-evidence/install-test-old/linerule.msixbundle `
            -PreviousAppInstallerPath release-evidence/install-test-old/linerule.appinstaller `
            -BundlePath release-evidence/dist/linerule.msixbundle `
            -AppInstallerPath release-evidence/dist/linerule.appinstaller `
            -PortableZip release-evidence/dist/linerule-portable-arm64.zip `
            -RequireSignature

  publish:
    name: publish immutable release
    needs: [package, arm64-package-lifecycle]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          install_args: aqua:cli/cli
          cache: true
      - name: publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |-
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          mise exec aqua:cli/cli -- gh release edit "$tag" --draft=false --latest
