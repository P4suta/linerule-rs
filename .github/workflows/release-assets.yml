# On tag push, build the Windows EXE + CycloneDX SBOM and attach them via a
# 3-step draft release -> upload -> publish flow.
# Immutable releases reject (422) adding assets to a published release, so
# "upload everything while draft, then publish last" is the only automatable
# path (ADR-0014).
# release-please owns CHANGELOG / version / tag push (`skip-github-release:
# true`); this workflow does the release attach.

name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build assets for (e.g. v0.4.1)" # manual retry on failure
        required: true

permissions:
  contents: write # needed for gh release create / upload / edit

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build-and-release:
    name: build EXE + SBOM, draft release, upload, publish
    runs-on: windows-latest
    timeout-minutes: 30
    # Gated behind the `release` Environment: required-reviewer approval +
    # ref restricted to `main`/`v*` before a release goes public.
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo build --release (shipping profile, panic=abort, strip=symbols)
        run: cargo build --release -p linerule-app

      - name: install cargo-sbom (CycloneDX generator)
        shell: pwsh
        run: cargo install cargo-sbom --locked --version "^0.10"

      - name: generate SBOM (CycloneDX 1.6 JSON)
        shell: pwsh
        run: |-
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          # Single-binary distribution (ADR-0011): only linerule-app's dependency closure.
          cargo sbom --output-format=cyclone_dx_json_1_6 --cargo-package linerule-app `
            > "linerule-${tag}-sbom.cdx.json"

      - name: rename EXE with tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          Copy-Item target/release/linerule.exe "linerule-${tag}-win-x64.exe"

      - name: create draft release (or reuse existing draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |-
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          # Reuse a leftover draft, else create one. Fail if already published, to avoid the 422.
          $existing = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "$tag" --generate-notes
          } elseif ($existing -ne "true") {
            Write-Error "release $tag already exists and is PUBLISHED — cannot attach assets to immutable release. Delete it manually first or pick a new tag."
            exit 1
          } else {
            Write-Host "reusing existing draft release $tag"
          }

      - name: upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |-
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          # `--clobber` makes re-upload idempotent (for manual retry).
          gh release upload $tag `
            "linerule-${tag}-win-x64.exe" `
            "linerule-${tag}-sbom.cdx.json" `
            --clobber

      - name: publish release (draft → public, locks immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |-
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          # Publishing locks it immutable; any later asset add returns 422.
          gh release edit $tag --draft=false --latest
