# Nightly build — the one deliberate scheduled workflow (CI itself has none;
# see ADR-0018). Produces an UNSIGNED, tagless win-x64 binary as a GitHub
# Actions artifact (14-day retention), clearly distinct from the signed,
# attested, immutable stable releases that release-assets.yml ships.
#
# Channel identity lives in the version string alone: the binary self-reports
# `X.Y.Z-nightly.<date>+g<sha>` (cargo xtask version --channel nightly), stamped
# through the LINERULE_VERSION build override. No tag, no Release, no signing,
# no SBOM, no attestation — retrieval is `gh run download --name linerule-nightly`.
#
# Trigger:
#   - schedule: daily, skipped when main saw no commits in the last 24h.
#   - workflow_dispatch: always builds (bypasses the freshness gate).

name: nightly

on:
  schedule:
    # 04:00 UTC daily — off-peak, after most of a day's merges have landed.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Build from the committed Cargo.lock, never a silent re-resolve.
  CARGO_NET_LOCKED: "true"

jobs:
  nightly-build:
    name: nightly build (win-x64, unsigned artifact)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the freshness probe can see the last 24h of commits.
          fetch-depth: 0

      # Skip the nightly when main is idle, so an unchanged tree doesn't ship a
      # redundant artifact. A manual dispatch always builds.
      - name: freshness gate (build only if main changed in 24h, or dispatched)
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch - building"
          elif [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "main changed in the last 24h - building"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no commits to main in the last 24h - skipping nightly"
          fi

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.freshness.outputs.build == 'true'

      # Stamp the nightly channel identity. cargo xtask version --channel nightly
      # formats X.Y.Z-nightly.<date>+g<sha>; build.rs picks up the override.
      - name: stamp nightly version
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          DATE="$(date -u +%Y%m%d)"
          echo "LINERULE_VERSION=$(cargo xtask version --channel nightly --date "$DATE")" >> "$GITHUB_ENV"

      - name: cargo build --release (shipping profile, panic=abort, strip=symbols)
        if: steps.freshness.outputs.build == 'true'
        run: cargo build --release -p linerule-app

      # Same GUI smoke as the CI release-build job: a nightly that can't even
      # boot into Horizontal + Blur is not worth distributing.
      - name: smoke - GUI (cargo xtask verify; mirrors CI release-build)
        if: steps.freshness.outputs.build == 'true'
        run: cargo xtask verify --profile release --mode horizontal --effect blur

      - name: rename EXE + write SHA256SUMS.txt
        if: steps.freshness.outputs.build == 'true'
        shell: pwsh
        run: |-
          $exe = "linerule-$env:LINERULE_VERSION-win-x64.exe"
          Copy-Item target/release/linerule.exe $exe
          # `sha256sum -c` 互換: 小文字 hex・bare filename・LF (Out-File は CRLF を吐く)。
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  $exe`n")
          Get-Content SHA256SUMS.txt

      - name: upload nightly artifact (unsigned, 14-day retention)
        if: steps.freshness.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linerule-nightly
          path: |
            linerule-*-win-x64.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
