# Scheduled nightly: unsigned, tagless win-x64 binary as an Actions artifact
# (14-day retention). Channel identity is the version string only:
# `X.Y.Z-nightly.<date>+g<sha>` via LINERULE_VERSION. No tag/Release/signing/
# SBOM/attestation; retrieve with `gh run download --name linerule-nightly`.
# Scheduled run skips when main is idle 24h; workflow_dispatch always builds.

name: nightly

on:
  schedule:
    # 04:00 UTC: off-peak, after the day's merges have landed.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Build from the committed Cargo.lock; no silent re-resolve.
  CARGO_NET_LOCKED: "true"

jobs:
  nightly-build:
    name: nightly build (win-x64, unsigned artifact)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the 24h freshness probe.
          fetch-depth: 0

      - name: freshness gate (build only if main changed in 24h, or dispatched)
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch - building"
          elif [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "main changed in the last 24h - building"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no commits to main in the last 24h - skipping nightly"
          fi

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.freshness.outputs.build == 'true'

      - name: stamp nightly version
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          DATE="$(date -u +%Y%m%d)"
          echo "LINERULE_VERSION=$(cargo xtask version --channel nightly --date "$DATE")" >> "$GITHUB_ENV"

      - name: cargo build --release (shipping profile, panic=abort, strip=symbols)
        if: steps.freshness.outputs.build == 'true'
        run: cargo build --release -p linerule-app

      # GUI smoke mirrors CI release-build: don't ship a nightly that can't boot.
      - name: smoke - GUI (cargo xtask verify; mirrors CI release-build)
        if: steps.freshness.outputs.build == 'true'
        run: cargo xtask verify --profile release --mode horizontal --effect blur

      - name: rename EXE + write SHA256SUMS.txt
        if: steps.freshness.outputs.build == 'true'
        shell: pwsh
        run: |-
          $exe = "linerule-$env:LINERULE_VERSION-win-x64.exe"
          Copy-Item target/release/linerule.exe $exe
          # `sha256sum -c` compatible: lowercase hex, bare filename, LF (Out-File emits CRLF).
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  $exe`n")
          Get-Content SHA256SUMS.txt

      - name: upload nightly artifact (unsigned, 14-day retention)
        if: steps.freshness.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linerule-nightly
          path: |
            linerule-*-win-x64.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
