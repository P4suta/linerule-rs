name: Signing helper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: esigner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify signing helper (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.11.7
          install_args: just powershell java
          cache: true
      - name: Install pinned test modules
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force
      - name: Verify helper without signing credentials
        run: mise exec just -- just test-esigner
