# linerule-rs CI.
#
# Policy:
#   - No `on: schedule` here; `nightly.yml` is the one scheduled workflow (ADR-0018).
#   - Actions SHA-pinned; Dependabot bumps weekly.
#   - Cross-platform jobs on ubuntu-latest; Windows-native build/test on
#     windows-latest (platform crate is `#![cfg(windows)]`).
#   - Coverage reported, not gated at 100%.
#   - `Swatinem/rust-cache` over raw `actions/cache` for cargo state.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Every required check must report on `merge_group` or the queue stalls.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # for coverage / dependency-review comments
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build-test-linux:
    name: build + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - name: cargo build (exclude platform-windows)
        run: cargo build --workspace --exclude linerule-platform-windows --all-targets
      - name: cargo nextest (exclude platform-windows)
        run: cargo nextest run --workspace --exclude linerule-platform-windows
      # nextest does not run doctests; run them as a separate step.
      - name: cargo test --doc (exclude platform-windows)
        run: cargo test --doc --workspace --exclude linerule-platform-windows

  build-test-windows:
    name: build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-targets
      - run: cargo nextest run --workspace --run-ignored all
      # nextest does not run doctests; run them as a separate step.
      - run: cargo test --doc --workspace

  cross-check:
    name: cross-check (linux → win-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # clang backend: single ~283 MB sysroot tarball (~25s) vs clang-cl
      # streaming ~500 MB of MSVC shards (~7 min).
      XWIN_CROSS_COMPILER: clang
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-xwin
      # Cache unpacked sysroot so re-runs skip the 25s fetch. cargo-xwin v0.18+
      # stores it under ~/.cache/cargo-xwin/. Bump key on upstream schema change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-clang-sysroot-${{ runner.os }}
      - run: rustup target add x86_64-pc-windows-msvc
      # `--all-targets` covers examples/tests/benches, matching Windows native CI's detection scope.
      - run: cargo xwin check --workspace --all-targets --target x86_64-pc-windows-msvc

  release-build:
    name: release build (win-x64, native)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --release -p linerule-app
      # Native smoke: built binary must start and respond to subcommands (clap
      # parse gate). linerule.exe is `windows_subsystem = "windows"` (GUI), so
      # pwsh `& $exe` returns immediately and never sets `$LASTEXITCODE`;
      # `Start-Process -Wait -PassThru` blocks and exposes `ExitCode`.
      - name: smoke - linerule.exe version
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/linerule.exe" `
            -ArgumentList "version" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::linerule.exe version exited with $($proc.ExitCode)"
            exit 1
          }
      - name: smoke - linerule.exe diagnostics --dry-run
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/linerule.exe" `
            -ArgumentList "diagnostics", "--dry-run" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::linerule.exe diagnostics --dry-run exited with $($proc.ExitCode)"
            exit 1
          }
      # GUI smoke via `cargo xtask verify` (shared with `just verify-blur`):
      # launches the real overlay 3s in Horizontal+Blur (exercises WinRT
      # backdrop-blur COM path), then judges events.jsonl — no ERROR / tick
      # failure / crash dump, clean message-loop exit (headless 0xE0464645
      # teardown tolerated). Blocks E_NOINTERFACE / D2D WRONG_STATE / missing
      # commit / missing ShowWindow.
      - name: smoke - GUI (cargo xtask verify; mirrors local just verify-blur)
        run: cargo xtask verify --profile release --mode horizontal --effect blur
      - name: Upload binary artifact
        # Upload the binary even if smoke crashes (to eyeball GUI/blur without real hardware).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linerule-win-x64
          path: target/release/linerule.exe
          if-no-files-found: error

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-sort,taplo-cli
      - run: cargo fmt --all -- --check
      - run: cargo sort --workspace --check
      - run: taplo fmt --check

  fmt-non-rust:
    name: fmt (json / yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: install biome + yamlfmt
        run: |
          curl -fsSL "https://github.com/biomejs/biome/releases/latest/download/biome-linux-x64" \
            -o /usr/local/bin/biome
          sudo chmod +x /usr/local/bin/biome
          YAMLFMT_VERSION=0.13.0
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin yamlfmt
      - run: biome format .
      - run: yamlfmt --lint .

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --exclude linerule-platform-windows -- -D warnings

  # Gate `cargo doc -D warnings` on PRs. The `docs` workflow only builds rustdoc
  # on push-to-main, so doc-only breakage (e.g. public→private intra-doc link)
  # could slip through PR CI. Keep this command in sync with docs.yml.
  doc:
    name: doc (cargo doc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --exclude linerule-platform-windows

  dep-graph:
    name: dep-graph (xtask)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo xtask dep-graph

  spell-check:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-deny
      # Workaround for rustsec/advisory-db RUSTSEC-2026-0076.md (TOML wrapped in
      # backtick fences, unparseable by cargo-deny/cargo-audit). cargo-deny v0.18+
      # clones to advisory-db-3157b0e258782691; drop the bad file, then
      # `--disable-fetch` so it isn't pulled back.
      - name: Pre-fetch advisory-db (RUSTSEC-2026-0076 workaround)
        run: |
          set -eux
          DB="$HOME/.cargo/advisory-dbs/advisory-db-3157b0e258782691"
          mkdir -p "$(dirname "$DB")"
          git clone --depth 1 https://github.com/rustsec/advisory-db "$DB"
          rm -f "$DB/crates/libcrux-ml-dsa/RUSTSEC-2026-0076.md"
      - run: cargo deny check --disable-fetch advisories bans licenses sources

  cargo-machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-machete
      - run: cargo machete

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-audit
      # Workaround for upstream rustsec/advisory-db RUSTSEC-2026-0076.md (see
      # cargo-deny job).
      - name: Pre-fetch advisory-db (RUSTSEC-2026-0076 workaround)
        run: |
          set -eux
          DB="$HOME/.cargo/advisory-db"
          git clone --depth 1 https://github.com/rustsec/advisory-db "$DB"
          rm -f "$DB/crates/libcrux-ml-dsa/RUSTSEC-2026-0076.md"
      - run: cargo audit --no-fetch --deny warnings

  coverage:
    # Required gate. Scope = linerule-core + linerule-app (platform-windows is
    # `#![cfg(windows)]`, excluded on the Linux runner; ADR-0004).
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: rustup component add llvm-tools-preview
      - name: cargo llvm-cov (fail under 80% lines)
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --exclude linerule-platform-windows \
            --exclude xtask \
            --lcov \
            --output-path lcov.info \
            --fail-under-lines 80
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          # Don't render OpenSSF Scorecard annotations: most warnings come from
          # uncontrolled transitive deps and drown out real findings.
          show-openssf-scorecard: false

  conventional-commits:
    name: conventional commits
    # Validate the PR title (the squash-merge commit subject) as Conventional
    # Commits. Local commit messages are enforced by committed (committed.toml)
    # via the lefthook commit-msg hook; this is the authoritative CI gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single aggregation gate. Branch/tag protection (`.github/rulesets/`) reference
  # one status context — `ci-required` — so adding/renaming a job never desyncs
  # the ruleset. `if: always()` so it runs when an upstream job fails; `skipped`
  # counts as pass, letting PR-only jobs report green on merge_group/push. See ADR-0019.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - build-test-linux
      - build-test-windows
      - cross-check
      - release-build
      - fmt
      - fmt-non-rust
      - clippy
      - doc
      - dep-graph
      - spell-check
      - actionlint
      - cargo-deny
      - cargo-machete
      - cargo-audit
      - coverage
      - dependency-review
      - conventional-commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: verify all required jobs passed (skipped counts as pass)
        run: |-
          results="${{ join(needs.*.result, ' ') }}"
          echo "needs results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed"
