# linerule-rs CI.
#
# Policy:
#   - No `on: schedule`. Dependabot is the only scheduled job.
#   - Every action is SHA-pinned; Dependabot bumps weekly.
#   - Cross-platform jobs run on ubuntu-latest; Windows-native build /
#     test runs on windows-latest because the platform crate is `#![cfg(windows)]`.
#   - Coverage is reported, not gated at 100%.
#   - `Swatinem/rust-cache` is used in place of raw `actions/cache` for cargo
#     state — it knows the right keys for `target/`, registry, and indexes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: every required check must report on the `merge_group`
  # event, otherwise the queue waits forever and the merge fails.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # for coverage / dependency-review comments
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build-test-linux:
    name: build + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-nextest
      - name: cargo build (exclude platform-windows)
        run: cargo build --workspace --exclude linerule-platform-windows --all-targets
      - name: cargo nextest (exclude platform-windows)
        run: cargo nextest run --workspace --exclude linerule-platform-windows
      # nextest does not run doctests; run them as a separate step.
      - name: cargo test --doc (exclude platform-windows)
        run: cargo test --doc --workspace --exclude linerule-platform-windows

  build-test-windows:
    name: build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-targets
      - run: cargo nextest run --workspace --run-ignored all
      # nextest does not run doctests; run them as a separate step.
      - run: cargo test --doc --workspace

  cross-check:
    name: cross-check (linux → win-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # clang backend = single 283 MB tarball from
      # trcrsired/windows-msvc-sysroot (~25 s) vs clang-cl streaming
      # 500 MB of MSVC shards from microsoft.com (~7 min).
      XWIN_CROSS_COMPILER: clang
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-xwin
      # Cache the unpacked sysroot so the second run skips even the 25 s
      # tarball fetch. cargo-xwin v0.18+ stores it under
      # ~/.cache/cargo-xwin/windows-msvc-sysroot/. Bump the key when
      # upstream trcrsired/windows-msvc-sysroot publishes a major schema
      # change.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-clang-sysroot-${{ runner.os }}
      - run: rustup target add x86_64-pc-windows-msvc
      # `--all-targets` で examples / tests / benches も対象にし、Windows
      # native CI (`cargo build --workspace --all-targets`) と検出範囲を揃える。
      - run: cargo xwin check --workspace --all-targets --target x86_64-pc-windows-msvc

  release-build:
    name: release build (win-x64, native)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --release -p linerule-app
      # P2-4: native smoke. The binary built above must actually start and
      # respond to subcommands — bare-minimum "did clap parsing survive?"
      # gate. Run hits stdout + exit code; we don't try to invoke `run` here
      # because it blocks on the message pump.
      #
      # `linerule.exe` is `windows_subsystem = "windows"` (GUI), so pwsh's
      # native call (`& $exe …`) returns immediately and `$LASTEXITCODE` is
      # never populated. `Start-Process -Wait -PassThru` actually blocks
      # until the process exits and exposes `ExitCode`.
      - name: smoke - linerule.exe version
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/linerule.exe" `
            -ArgumentList "version" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::linerule.exe version exited with $($proc.ExitCode)"
            exit 1
          }
      - name: smoke - linerule.exe diagnostics --dry-run
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/linerule.exe" `
            -ArgumentList "diagnostics", "--dry-run" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::linerule.exe diagnostics --dry-run exited with $($proc.ExitCode)"
            exit 1
          }
      # P0 / Phase α: GUI smoke. `linerule.exe run --duration-ms 3000` で
      # 実 GUI overlay を 3 秒だけ起動 (`AutoQuitTimer` が `WM_APP_QUIT_TIMER`
      # を送り `PostQuitMessage` で graceful 終了)。終了後 `events.jsonl` を
      # scan して `tick processing failed` (PR #57/#59 系の症状) や
      # `level":"ERROR"` (PR #60 系の symptom) が 0 件であることを確認する。
      #
      # これで Phase I で発覚した 4 つの bug (E_NOINTERFACE / D2D
      # WRONG_STATE / commit 漏れ / ShowWindow 漏れ) はすべて動的に CI で
      # ブロックされる。
      - name: smoke - linerule.exe run --initial-mode horizontal --initial-effect blur --duration-ms 3000 (GUI headless)
        shell: pwsh
        run: |
          # 過去 run の events.jsonl / crash dump をクリーンアップ (誤検知防止)。
          Remove-Item "target/release/events.jsonl*" -ErrorAction SilentlyContinue
          Remove-Item "target/release/crash-*.json" -ErrorAction SilentlyContinue
          # 失敗時診断: GUI subsystem (windows_subsystem="windows") は stderr が無いため、
          # crash の中身は events.jsonl / crash-*.json が唯一の手がかり。target/release と
          # %APPDATA%\linerule (diagnostics サブコマンド経由) の両方を吐き出す。
          function Dump-Diagnostics {
            Write-Host "--- target/release events.jsonl.* (tail 80) ---"
            $l = Get-ChildItem -Path "target/release" -Filter "events.jsonl.*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($l) { Get-Content $l.FullName | Select-Object -Last 80 } else { Write-Host "(none)" }
            Write-Host "--- target/release crash-*.json ---"
            $c = Get-ChildItem -Path "target/release" -Filter "crash-*.json" -ErrorAction SilentlyContinue
            if ($c) { $c | ForEach-Object { Write-Host "# $($_.Name)"; Get-Content $_.FullName } } else { Write-Host "(none)" }
            Write-Host "--- diagnostics --last-crash / --recent-events 80 (%APPDATA%) ---"
            & "target/release/linerule.exe" diagnostics --last-crash 2>&1 | Out-Host
            & "target/release/linerule.exe" diagnostics --recent-events 80 2>&1 | Out-Host
          }
          # `--initial-mode horizontal --initial-effect blur` で HUD + slit に加え
          # WinRT backdrop-blur の COM 経路 (effect factory / IGraphicsEffectD2D1Interop /
          # CreateBackdropBrush / tint sprite) を起動直後から exercise する。
          $proc = Start-Process -FilePath "target/release/linerule.exe" `
            -ArgumentList "run", "--initial-mode", "horizontal", "--initial-effect", "blur", "--duration-ms", "3000" `
            -Wait -PassThru -NoNewWindow
          $exit = $proc.ExitCode

          # --- 描画ヘルスのハード判定 (exit code とは独立に必ず fail させる) ---
          # events.jsonl が無い = 起動・描画パスに到達していない。
          $log = Get-ChildItem -Path "target/release" -Filter "events.jsonl.*" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) {
            Write-Host "::error::events.jsonl not produced by GUI smoke run (exit=$exit)"
            Dump-Diagnostics
            exit 1
          }
          $logBody = Get-Content $log.FullName
          # ERROR イベント (CreateEffectFactory 失敗等) は描画バグなので必ず fail。
          $errLines = $logBody | Select-String -Pattern '"level":"ERROR"'
          if ($errLines) {
            Write-Host "::error::found $($errLines.Count) ERROR events during GUI smoke run (exit=$exit)"
            Dump-Diagnostics
            exit 1
          }
          $failLines = $logBody | Select-String -Pattern '"message":"tick processing failed"'
          if ($failLines) {
            Write-Host "::error::found $($failLines.Count) tick processing failed events (exit=$exit)"
            Dump-Diagnostics
            exit 1
          }
          # Rust panic は crash dump を残す。あれば fail。
          $crashes = Get-ChildItem -Path "target/release" -Filter "crash-*.json" -ErrorAction SilentlyContinue
          if ($crashes) {
            Write-Host "::error::found $($crashes.Count) crash dump(s) after GUI smoke (exit=$exit)"
            $crashes | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }

          # --- exit code の評価 ---
          if ($exit -eq 0) {
            Write-Host "GUI smoke OK: $($log.Name) clean (no ERROR / tick-failed / crash dump), exit 0"
            exit 0
          }
          # 非ゼロ終了。「メッセージループは正常終了した後、teardown で落ちた」場合に限り
          # 許容する。これは WinRT backdrop-blur の teardown が GitHub headless runner 上
          # でのみ非ゼロ終了する既知の現象 (0xE0464645) で、実機 (interactive desktop) では
          # --duration-ms / Ctrl+Alt+Q いずれも exit 0 になることを確認済み (no-blur は
          # headless でも exit 0)。描画は上の ERROR / tick-failed / crash-dump ゲートを
          # 全通過しているので、ここで許容しても「描画が壊れた blur」が ship されることはない。
          $loopExited = $logBody | Select-String -Pattern '"message":"Win32 message loop exited"'
          if ($loopExited) {
            Write-Host "::warning::GUI smoke: clean render but non-zero exit ($exit) during teardown — known headless-only WinRT blur teardown artifact (real hardware exits 0). Tolerating."
            Dump-Diagnostics
            exit 0
          }
          # メッセージループ正常終了の記録が無い = run 中のクラッシュ。これは fail。
          Write-Host "::error::linerule.exe run (blur) exited with $exit before a clean message-loop exit (crash during run, not teardown)"
          Dump-Diagnostics
          # 切り分けプローブ: blur 無し (WinRT + DimBlack) でも run 中に落ちるか。
          Write-Host "--- probe: WinRT + DimBlack (no blur), 1500ms ---"
          $probe = Start-Process -FilePath "target/release/linerule.exe" `
            -ArgumentList "run", "--initial-mode", "horizontal", "--duration-ms", "1500" `
            -Wait -PassThru -NoNewWindow
          Write-Host "probe (no-blur) exit code: $($probe.ExitCode)"
          exit 1
      - name: Upload binary artifact
        # smoke が crash しても binary は upload する。実機ビルド環境が無くても
        # この artifact を download して GUI / blur を目視確認できるようにする。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linerule-win-x64
          path: target/release/linerule.exe
          if-no-files-found: error

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-sort,taplo-cli
      - run: cargo fmt --all -- --check
      - run: cargo sort --workspace --check
      - run: taplo fmt --check

  fmt-non-rust:
    name: fmt (json / yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: install biome + yamlfmt
        run: |
          curl -fsSL "https://github.com/biomejs/biome/releases/latest/download/biome-linux-x64" \
            -o /usr/local/bin/biome
          sudo chmod +x /usr/local/bin/biome
          YAMLFMT_VERSION=0.13.0
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin yamlfmt
      - run: biome format .
      - run: yamlfmt --lint .

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --exclude linerule-platform-windows -- -D warnings

  # Gate `cargo doc -D warnings` on PRs. The `docs` workflow only builds rustdoc
  # on push-to-main (it also deploys to Pages), so doc-only breakage (e.g. a
  # public→private intra-doc link) used to slip through PR CI and fail on main.
  # This job mirrors that workflow's build command exactly, minus the Pages
  # deploy. Keep the command in sync with `.github/workflows/docs.yml`.
  doc:
    name: doc (cargo doc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --exclude linerule-platform-windows

  dep-graph:
    name: dep-graph (xtask)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo xtask dep-graph

  spell-check:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-deny
      # Workaround for upstream rustsec/advisory-db RUSTSEC-2026-0076.md which
      # wraps its TOML frontmatter in triple-backtick fences and cannot be
      # parsed by cargo-deny / cargo-audit. cargo-deny v0.18+ names the local
      # clone `advisory-db-3157b0e258782691` (stable hash, see PR#745). Drop
      # the malformed file there, then run with `--disable-fetch` so the
      # next pass doesn't `git pull` the broken file back.
      - name: Pre-fetch advisory-db (RUSTSEC-2026-0076 workaround)
        run: |
          set -eux
          DB="$HOME/.cargo/advisory-dbs/advisory-db-3157b0e258782691"
          mkdir -p "$(dirname "$DB")"
          git clone --depth 1 https://github.com/rustsec/advisory-db "$DB"
          rm -f "$DB/crates/libcrux-ml-dsa/RUSTSEC-2026-0076.md"
      - run: cargo deny check --disable-fetch advisories bans licenses sources

  cargo-machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-machete
      - run: cargo machete

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-audit
      # Workaround for upstream rustsec/advisory-db RUSTSEC-2026-0076.md (see
      # cargo-deny job).
      - name: Pre-fetch advisory-db (RUSTSEC-2026-0076 workaround)
        run: |
          set -eux
          DB="$HOME/.cargo/advisory-db"
          git clone --depth 1 https://github.com/rustsec/advisory-db "$DB"
          rm -f "$DB/crates/libcrux-ml-dsa/RUSTSEC-2026-0076.md"
      - run: cargo audit --no-fetch --deny warnings

  coverage:
    # P2-3: required gate. Scope = linerule-core + linerule-app
    # (linerule-platform-windows is `#![cfg(windows)]` and excluded on the
    # Linux runner; see docs/adr/0004-coverage-policy.md).
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: rustup component add llvm-tools-preview
      - name: cargo llvm-cov (fail under 80% lines)
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --exclude linerule-platform-windows \
            --exclude xtask \
            --lcov \
            --output-path lcov.info \
            --fail-under-lines 80
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          # Don't render OpenSSF Scorecard annotations: most warnings come
          # from transitive deps we don't control (e.g. vswhom/vswhom-sys
          # pulled by embed-resource) and the noise drowns out real findings.
          show-openssf-scorecard: false

  conventional-commits:
    name: conventional commits
    # Runs the real lint on pull_request. On merge_group it runs as a no-op
    # that reports success: the PR commits were already linted, and the
    # merge queue only needs this required check to report a result so the
    # queue does not stall.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: github.event_name == 'pull_request'
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        if: github.event_name == 'pull_request'
