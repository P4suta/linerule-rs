# Drives release PRs and tags from Conventional Commits.
# On main push: opens/updates a release PR (version bump, CHANGELOG, Cargo.lock).
# On release-PR merge: action skips tagging (skip-github-release: true), so the
# "ensure tag" step pushes the tag, then dispatches release-assets (ADR-0014).
# Bump: feat=minor, fix/perf=patch, !/BREAKING=major.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # gh workflow run release-assets.yml

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # skip-github-release: true skips both tag and Release; without a tag,
      # release-please aborts the next run ("untagged, merged release PRs
      # outstanding"). Push the tag ourselves and dispatch release-assets, since
      # tags pushed with GITHUB_TOKEN don't trigger other workflows.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ensure release tag is pushed (skip-github-release workaround)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -euo pipefail
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          TAG="v${VERSION}"
          # no-op if tag already exists on origin (normal push)
          if git ls-remote --tags origin "${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} already exists on origin, nothing to do"
            exit 0
          fi
          # HEAD is the bump commit; create the lightweight tag release-please would have made.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "pushed tag ${TAG} -> ${GITHUB_SHA}"
          # Tag pushes via GITHUB_TOKEN don't trigger other workflows, so dispatch explicitly.
          gh workflow run release-assets.yml -f tag="${TAG}"
          echo "dispatched release-assets workflow for ${TAG}"
