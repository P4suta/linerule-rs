# Drives release PRs and tags from Conventional Commits, authenticated as a
# GitHub App (not GITHUB_TOKEN). GITHUB_TOKEN-authored events don't cascade, so a
# token-created release PR never runs CI (unmergeable under the ci-required
# ruleset) and a token-pushed tag never fires release-assets. An App installation
# token is a real actor: its PR triggers CI and its tag triggers release-assets.
# Requires release-please environment secrets RELEASE_PLEASE_CLIENT_ID +
# RELEASE_PLEASE_APP_PRIVATE_KEY from an installed App with Contents:write +
# Pull requests:write (see docs/RELEASE.md).
#
# On main push: open/update a release PR (version bump, CHANGELOG, Cargo.lock).
# On release-PR merge: action skips tagging (skip-github-release: true), so we
# reconcile the autorelease label and push the tag; the App-pushed tag triggers
# release-assets (ADR-0014). Bump: feat=minor, fix/perf=patch, !/BREAKING=major.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual re-evaluation (e.g. after clearing a stuck label)

# GITHUB_TOKEN stays read-only; every write flows through the App token below.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # App secrets are scoped to this environment. Unlike the signing `release`
    # environment, it has no required reviewers (one would gate every push). The
    # declaration is mandatory: without it, environment-scoped secrets are
    # unreadable and create-github-app-token fails on empty inputs.
    environment: release-please
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      # release-please bumps Cargo.toml's [workspace.package] version (toml
      # extra-files updater) but the `simple` release-type never touches
      # Cargo.lock, so the lock's linerule-* member versions go stale and the
      # Release PR's own `--locked` CI (and release-assets, CARGO_NET_LOCKED)
      # would fail. Sync the lock on the Release PR branch. Parse the PR JSON in
      # bash (jq), never `fromJSON()` in YAML: a step's `env:` is evaluated
      # eagerly regardless of `if:`, so a `fromJSON('')` there crashes the no-op
      # runs where `pr` is empty. This step is gated on a plain string compare
      # and emits a plain string output.
      - name: resolve the Release PR branch
        id: rp_branch
        if: ${{ steps.rp.outputs.pr != '' }}
        env:
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: echo "branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')" >> "$GITHUB_OUTPUT"
      - name: check out the Release PR branch
        if: ${{ steps.rp_branch.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rp_branch.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
      - name: sync Cargo.lock to the bumped workspace version
        if: ${{ steps.rp_branch.outputs.branch != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.rp_branch.outputs.branch }}
        run: |-
          set -euo pipefail
          # `cargo update --workspace` only rewrites the path-crate versions in
          # the lock (no compile), so the runner's default cargo suffices.
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync."
            exit 0
          fi
          # Commit via the Contents API, not `git push`: the repo's
          # require-signed-commits ruleset rejects an unsigned bot commit, but a
          # commit created through the API is signed by GitHub (the same way
          # release-please's own commits are). One file, on the Release PR branch.
          gh api --method PUT "repos/$REPO/contents/Cargo.lock" \
            -f message="chore: sync Cargo.lock to the release version" \
            -f branch="$BRANCH" \
            -f sha="$(git rev-parse "HEAD:Cargo.lock")" \
            -f content="$(base64 -w0 Cargo.lock)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # skip-github-release: true means the action never tags nor advances a merged
      # release PR's `autorelease: pending` label to `tagged`. Left alone,
      # release-please aborts every later run ("untagged, merged release PRs
      # outstanding"). Reconcile the label ourselves (unconditionally, so a stuck PR
      # clears on the next run), then push the tag. The App-token push triggers
      # release-assets on its own — no explicit dispatch needed.
      - name: reconcile autorelease label + push release tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          set -euo pipefail
          # Any merged release PR still marked pending -> tagged (covers the
          # just-merged PR and any historical straggler that blocked the queue).
          gh pr list --state merged --label "autorelease: pending" --json number \
            --jq '.[].number' | while read -r pr; do
            gh pr edit "$pr" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
            echo "reconciled autorelease label on PR #${pr}"
          done
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          TAG="v${VERSION}"
          if git ls-remote --tags origin "${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} already exists on origin, nothing to push"
            exit 0
          fi
          # HEAD is the bump commit; create the lightweight tag release-please would have.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "pushed tag ${TAG} -> ${GITHUB_SHA}; release-assets triggers on the tag"
