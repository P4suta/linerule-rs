# Auto-merge Dependabot PRs through the merge queue once required CI passes.
#
# Policy:
#   - All bumps (patch / minor / major) get auto-merge enabled.
#   - The merge queue plus the required status checks gate the actual merge,
#     so a red CI still blocks it — this only removes the human click.
#   - The merge method is governed by the merge queue (squash), so we do not
#     pass a method flag to `gh pr merge`.

name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: enable auto-merge (all bumps; merge queue + CI gate the merge)
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
