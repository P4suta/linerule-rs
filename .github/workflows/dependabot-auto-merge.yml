# Auto-merge Dependabot PRs once required CI passes.
#
# Policy:
#   - All bumps (patch / minor / major) get auto-merge enabled (squash).
#   - Branch protection's required status checks gate the actual merge, so a
#     red CI still blocks it — this only removes the human click.
#   - main requires branches to be up to date (strict); Dependabot rebases its
#     own PRs when main moves so they catch up and then merge.

name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: enable auto-merge (all bumps; required CI gates the merge)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
