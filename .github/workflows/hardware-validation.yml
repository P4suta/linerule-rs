name: Windows 11 release hardware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hardware:
    name: hardware validation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner_arch: X64
            platform: x64
            runtime: win-x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner_arch: ARM64
            platform: ARM64
            runtime: win-arm64
            target: aarch64-pc-windows-msvc
    runs-on: [self-hosted, Windows, "${{ matrix.runner_arch }}", linerule-hardware]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          install_args: rust cargo:cargo-nextest dotnet node npm:@microsoft/winappcli
          cache: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: require Windows 11, interactive desktop, hardware GPU, and mixed DPI
        shell: pwsh
        run: >-
          ./tools/Test-Hardware.ps1
          -RequiredArchitecture ${{ matrix.arch }}
          -OutputDirectory artifacts/hardware
      - name: compile Fluent settings through the supported entry point
        shell: pwsh
        run: >-
          ./ui/linerule-settings/BuildAndRun.ps1
          -Platform ${{ matrix.platform }}
          -Configuration Release
          -SkipRun
      - name: settings UI Automation
        shell: pwsh
        run: >-
          ./ui/linerule-settings/UiTests.ps1
          -Platform ${{ matrix.platform }}
          -Configuration Release
          -SkipBuild
          -OutputDirectory artifacts/ui
      - name: High Contrast settings UI Automation
        shell: pwsh
        run: >-
          ./ui/linerule-settings/UiTests.ps1
          -Platform ${{ matrix.platform }}
          -Configuration Release
          -SkipBuild
          -EnableHighContrast
          -OutputDirectory artifacts/ui-high-contrast
      - name: native ignored recovery and 10-second idle tests
        run: >-
          mise exec cargo:cargo-nextest --command
          'cargo nextest run
          -p linerule-platform-windows
          --all-targets
          --run-ignored all
          --no-fail-fast'
      - name: build resident release executable
        run: >-
          mise exec rust --command
          'cargo build --locked --release -p linerule-app
          --target ${{ matrix.target }}'
      - name: publish self-contained Fluent settings sidecar
        shell: pwsh
        run: |
          $project = "ui/linerule-settings/Linerule.Settings.csproj"
          mise exec dotnet --command (
            "dotnet publish `"$project`" --no-restore -c Release " +
            "-p:Platform=${{ matrix.platform }} " +
            "-r ${{ matrix.runtime }} --self-contained true " +
            "-p:PublishDir=$PWD/settings-publish/"
          )
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }
          if (-not (
            Test-Path settings-publish/linerule-settings.exe -PathType Leaf
          )) {
            throw "WinUI single-file executable was not published"
          }
      - name: resident shell and transactional settings UI Automation
        shell: pwsh
        run: >-
          ./tools/Test-Shell.ps1
          -Executable target/${{ matrix.target }}/release/linerule.exe
          -SettingsExecutable settings-publish/linerule-settings.exe
          -HardwareEvidence artifacts/hardware/hardware.json
          -OutputDirectory artifacts/shell
      - name: Backdrop Blur pixels and active-frame p99
        shell: pwsh
        run: >-
          ./tools/Test-Blur.ps1
          -Executable target/${{ matrix.target }}/release/linerule.exe
          -OutputDirectory artifacts/blur
      - name: confirm hardware topology did not change during validation
        shell: pwsh
        run: >-
          ./tools/Test-Hardware.ps1
          -RequiredArchitecture ${{ matrix.arch }}
          -OutputDirectory artifacts/hardware-final
      - name: upload release hardware evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-11-${{ matrix.arch }}-hardware
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  hardware-required:
    name: hardware-required
    if: always()
    needs: hardware
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: require every native hardware job
        env:
          RESULT: ${{ needs.hardware.result }}
        run: |-
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::native hardware matrix result is $RESULT"
            exit 1
          fi
