# Native (Docker-less) dev toolchain. Mirrors the Dockerfile's tools for hosts
# without Docker: `mise install`, then `just doctor-native` to verify.
# The Rust toolchain itself is owned by rust-toolchain.toml.

[tools]
# Task runner, git hooks, and the format/lint tools the recipes shell out to.
just = "latest"
lefthook = "latest"
taplo = "latest"
biome = "latest"
yamlfmt = "0.13.0"    # pinned to match the Dockerfile (format stability)
actionlint = "latest"
typos = "latest"
jq = "latest"

# Lets the cargo: backend fetch prebuilt binaries instead of compiling.
cargo-binstall = "latest"

# Cargo subcommands via the cargo: backend (no mise registry short names exist).
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-sort" = "latest"
"cargo:cargo-rdme" = "latest"
"cargo:cargo-modules" = "latest"
"cargo:cargo-depgraph" = "latest"

# Conventional-Commits linter for the lefthook commit-msg hook — the local guard
# that keeps release-please's version + CHANGELOG derivation fed with well-formed
# commits.
"cargo:committed" = "1"

[settings.cargo]
# Use cargo-binstall (prebuilt binaries) for cargo: backend tools, not source builds.
binstall = true
