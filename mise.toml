# Native (Docker-less) dev toolchain for linerule-rs.
#
# The dev container (Dockerfile) bakes in every tool the Justfile recipes
# invoke. On a native Windows host without Docker, mise provisions the same
# set: run `mise install`, then `just doctor-native` to verify. The Rust
# toolchain itself (channel / components / targets) is owned by
# rust-toolchain.toml — mise only manages the auxiliary tools.
#
# Versions track the Dockerfile where it pins explicitly (yamlfmt); the rest
# follow the Dockerfile's "latest"/binstall policy. `just doctor-native`
# surfaces anything missing with the remediation.

[tools]
# JS runtime for commitlint (commit-msg hook).
bun = "latest"

# Task runner, git hooks, and the format/lint tools the recipes shell out to.
just = "latest"
lefthook = "latest"
taplo = "latest"
biome = "latest"
yamlfmt = "0.13.0"    # pinned to match the Dockerfile (format stability vs CI)
actionlint = "latest"
typos = "latest"
jq = "latest"

# cargo-binstall lets the cargo: backend below fetch prebuilt binaries instead
# of compiling each crate from source (mirrors the Dockerfile's binstall step).
cargo-binstall = "latest"

# Cargo subcommands the recipes / xtask invoke. No mise registry short names
# exist for these, so use the cargo: backend (binstalled via the setting below).
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-sort" = "latest"
"cargo:cargo-rdme" = "latest"
"cargo:cargo-modules" = "latest"
"cargo:cargo-depgraph" = "latest"

[settings.cargo]
# Pull prebuilt binaries via cargo-binstall for the cargo: backend tools above
# rather than a from-source `cargo install` (much faster, matches Dockerfile).
binstall = true
