# Install with `just hooks`. All commands inherit the mise environment.

assert_lefthook_installed: true
no_tty: false
colors: true

pre-commit:
  parallel: false
  follow: true
  commands:
    cargo-fmt:
      tags: format
      glob: "*.rs"
      run: mise exec just --command "just _hook-fmt {staged_files}"
      stage_fixed: true

    cargo-sort:
      tags: format
      glob: "{**/Cargo.toml,Cargo.lock}"
      run: mise exec just --command "just _hook-cargo-sort"
      stage_fixed: true

    taplo-fmt:
      tags: format
      glob: "*.toml"
      run: mise exec just --command "just _hook-taplo-fmt {staged_files}"
      stage_fixed: true

    biome-format:
      tags: format
      glob: "{*.json,*.jsonc}"
      run: mise exec just --command "just _hook-biome-format {staged_files}"
      stage_fixed: true

    yamlfmt:
      tags: format
      glob: "{*.yml,*.yaml}"
      run: mise exec just --command "just _hook-yamlfmt {staged_files}"
      stage_fixed: true

    typos-fix:
      tags: spell
      run: mise exec just --command "just _hook-typos-fix {staged_files}"
      stage_fixed: true

    actionlint:
      tags: ci
      glob: "{.github/workflows/*.yml,.github/workflows/*.yaml}"
      run: mise exec just --command "just _hook-actionlint {staged_files}"

    xtask-dep-graph:
      tags: lint
      glob: "{**/Cargo.toml,Cargo.lock}"
      run: mise exec just --command "just _hook-xtask-dep-graph"

    reuse:
      tags: license
      run: mise exec just --command "just reuse"

    policy:
      tags: lint
      run: mise exec just --command "just policy"

    clippy:
      tags: lint
      glob: "*.rs"
      run: mise exec just --command "just clippy"

    rustdoc-check:
      tags: docs
      glob: "*.rs"
      run: mise exec just --command "just rustdoc-check"

    cross-check:
      tags: build
      glob: "*.rs"
      run: mise exec just --command "just cross-check"

commit-msg:
  commands:
    committed:
      run: mise exec cargo:committed --command "committed --commit-file {1}"

pre-push:
  piped: true
  commands:
    lint:
      tags: lint
      run: mise exec just --command "just lint"
      only:
        - run: git rev-list --count HEAD ^@{upstream} 2>/dev/null || git rev-list --count HEAD
    test:
      tags: test
      run: mise exec just --command "just test"
      only:
        - run: git rev-list --count HEAD ^@{upstream} 2>/dev/null || git rev-list --count HEAD
    cross-check:
      tags: build
      run: mise exec just --command "just cross-check"
      only:
        - run: git rev-list --count HEAD ^@{upstream} 2>/dev/null || git rev-list --count HEAD
    rustdoc-check:
      tags: docs
      run: mise exec just --command "just rustdoc-check"
      only:
        - run: git rev-list --count HEAD ^@{upstream} 2>/dev/null || git rev-list --count HEAD
