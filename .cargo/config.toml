[alias]
xtask = "run --quiet --package xtask --"

[build]
# Default target stays native; CI overrides for cross checks.

# Linux native: use clang + mold linker. CI installs mold explicitly; local
# Linux users install the system linker while every versioned tool stays in mise.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-msvc]
# Empty; cargo-xwin fills this in. Override linker if needed.

[term]
color = "auto"
