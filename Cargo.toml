[workspace]
resolver = "3"
members = [
    "crates/linerule-app",
    "crates/linerule-core",
    "crates/linerule-platform-windows",
    "xtask",
]
default-members = ["crates/linerule-core", "crates/linerule-app"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.5.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/linerule-rs"
authors = ["linerule contributors"]

[workspace.dependencies]
anyhow = "1"

# Dev-only — testing
assert_cmd = "2"

# Bitflag DSL (Modifiers)
bitflags = "2"

# xtask helpers
cargo_metadata = "0.23"

# CLI / config
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

# Utilities
embed-resource = "3"
insta = { version = "1", features = ["yaml", "json", "redactions"] }
predicates = "3"
proptest = "1"

# Serialization / errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# Structured logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "registry"] }
tracing-test = "0.2"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
# Win32 / COM
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Explicit promotions for cleanliness
wildcard_imports = "deny"
mod_module_files = "deny"
or_fun_call = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "deny" # `#[allow]` requires a reason
disallowed_macros = "deny"               # denylist in clippy.toml
disallowed_types = "deny"                # denylist in clippy.toml
disallowed_methods = "deny"

# Exceptions (lints whose design conflicts with this project's policy)
module_name_repetitions = "allow" # clashes with natural names like `OverlayConfig`
multiple_crate_versions = "allow" # depends on the transitive graph, uncontrollable here
cargo_common_metadata = "allow"   # internal, publish=false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
static_mut_refs = "deny"           # forbid references through `static mut`
missing_docs = "warn"              # doc required on every public item (effectively deny under CI -D warnings)

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
overflow-checks = false

[profile.dev]
opt-level = 0
debug = "full"

# For fast CI checks
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false
